<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B型事業所 送迎管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* 業務帳票レイアウト：上部タブ＋1カラムの作業面。お迎え＝朝の橙、お送り＝夕方の青で区別 */
:root{
  --bg:#ffffff; --surface:#f4f7f6; --line:#d6dfdd; --line-strong:#a9b8b5;
  --fg:#1b2624; --muted:#5a6a67; --accent:#16695a; --accent-ink:#ffffff; --accent-soft:#e1f1ec;
  --pick:#a65405; --pick-soft:#fdf0e1; --drop:#2b58a6; --drop-soft:#e8eefa;
  --danger:#b3261e; --warn:#8a5a00; --warn-soft:#fff4d6; --desk:#e7ecea;
  --font-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --font-num:"BIZ UDGothic","BIZ UDPGothic","Yu Gothic UI","Meiryo",monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --line:#2d3a37; --line-strong:#4a5c58;
  --fg:#e6eeec; --muted:#9fb0ac; --accent:#4fbfa6; --accent-ink:#0d1c18; --accent-soft:#1b3630;
  --pick:#f0a35a; --pick-soft:#33261a; --drop:#8fb2f0; --drop-soft:#1c2638;
  --danger:#f08a80; --warn:#e8c169; --warn-soft:#332a14; --desk:#0c100f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --line:#2d3a37; --line-strong:#4a5c58;
  --fg:#e6eeec; --muted:#9fb0ac; --accent:#4fbfa6; --accent-ink:#0d1c18; --accent-soft:#1b3630;
  --pick:#f0a35a; --pick-soft:#33261a; --drop:#8fb2f0; --drop-soft:#1c2638;
  --danger:#f08a80; --warn:#e8c169; --warn-soft:#332a14; --desk:#0c100f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.mode{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--surface);color:var(--muted)}
.mode.shared{background:var(--accent-soft);color:var(--accent)}
.mode.local{background:var(--warn-soft);color:var(--warn)}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{flex:none;text-decoration:none;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;font-weight:700;font-size:15px}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
main{padding-block:20px 120px}
h1{font-size:24px;margin:0 0 4px;text-wrap:balance}
h2{font-size:19px;margin:0;text-wrap:balance}
h3{font-size:17px;margin:0}
.sub{color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--bg);min-width:0}
.panel.soft{background:var(--surface);border-color:transparent}
.btn{font:inherit;font-weight:700;min-height:48px;padding:8px 18px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--bg)}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px}
.btn.big{min-height:56px;font-size:18px;padding:8px 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;min-height:44px;padding:6px 10px;max-width:100%}
input[type=time]{font-family:var(--font-num);width:7.4em;padding:6px 6px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent);margin:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:700}
label.f input,label.f select{color:var(--fg);font-weight:400}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.tag.pick{background:var(--pick-soft);color:var(--pick)}
.tag.drop{background:var(--drop-soft);color:var(--drop)}
.tag.extra{background:var(--warn-soft);color:var(--warn)}
.scroll{overflow-x:auto;min-width:0}
table.grid{border-collapse:collapse;width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.grid th{font-size:13px;color:var(--muted);letter-spacing:.04em;background:var(--surface);white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r)}
.note{font-size:14px;color:var(--muted)}
/* home */
.today{font-size:34px;font-weight:700;line-height:1.3}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--fg);border:1px solid var(--line-strong);border-radius:var(--r);padding:18px;min-height:110px}
.tile:hover{background:var(--surface)}
.tile b{font-size:19px}
.tile span{color:var(--muted);font-size:14px}
.tile.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.main span{color:var(--accent-ink);opacity:.85}
/* 当日の送迎入力 */
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar input[type=date]{font-size:18px;font-family:var(--font-num)}
.wday{font-size:22px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{border:2px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.card .nm{font:inherit;font-size:20px;font-weight:700;min-height:62px;padding:8px 12px;border:0;background:transparent;color:var(--fg);cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.card.sel .nm{background:var(--accent);color:var(--accent-ink)}
.card .nm .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.card.sel .nm .ck{border-color:var(--accent-ink);background:var(--accent-ink);color:var(--accent)}
.card .legs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.chip{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px 8px;min-height:50px;text-align:left;display:flex;flex-direction:column;line-height:1.3}
.chip+.chip{border-left:1px solid var(--line)}
.chip b{font-size:13px}
.chip span{font-family:var(--font-num);font-size:13px}
.chip.on.pick{background:var(--pick);color:var(--bg)}
.chip.on.drop{background:var(--drop);color:var(--bg)}
.chip.na{opacity:.45}
.card .vh{font-size:12px;color:var(--muted);padding:2px 12px 6px}
.card.sel .vh{color:var(--fg)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px}
.vcard{border:1px solid var(--line-strong);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.vcard > h3{font-size:20px}
.legbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.legbox .who{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:end}
.legbox .who > .tag{align-self:center;font-size:14px}
.legbox select{width:100%}
table.trip{border-collapse:collapse;width:100%;min-width:780px}
table.trip tr.own td{background:var(--warn-soft)}
table.trip th{font-size:12px;color:var(--muted);text-align:left;padding:2px 4px;font-weight:700}
table.trip td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.trip td.n{font-weight:700;min-width:6em}
table.trip select{min-height:40px;padding:4px;min-width:5.6em}
table.trip input[type=text]{min-height:40px;width:100%;min-width:6em}
table.trip input[type=time]{min-height:40px;width:6.6em}
.x{font:inherit;width:40px;height:40px;border-radius:6px;border:1px solid var(--line-strong);background:var(--bg);color:var(--muted);cursor:pointer;font-size:18px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.state{font-weight:700}
.state.dirty{color:var(--warn)}
.state.ok{color:var(--accent)}
.ofields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ofields select{width:100%}
.olist{display:flex;flex-direction:column;gap:6px}
.oitem{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.dayhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:var(--r);background:var(--surface)}
.dayhead input[type=date]{font-size:19px;font-family:var(--font-num);min-height:48px}
.dayhead .btn{min-height:48px;min-width:48px}
.cnt{display:inline-flex;gap:6px}
.cnt .tag{font-size:15px;padding:3px 10px}
.block{display:flex;flex-direction:column;gap:12px}
.bh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:6px}
.bh h2{font-size:22px}
.hint{margin:0;color:var(--muted);font-size:14px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--bg)}
.rrow.sel{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.rname{font:inherit;font-size:20px;font-weight:700;min-height:56px;padding:6px 12px;border:2px solid var(--line-strong);border-radius:var(--r);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.rname:hover{border-color:var(--accent)}
.rname .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.rrow.sel .rname{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rrow.sel .rname .ck{border-color:var(--accent-ink);background:var(--accent-ink);color:var(--accent)}
.rname.static{cursor:default;flex-wrap:wrap;gap:6px 10px;background:transparent!important;color:var(--fg)!important;border-color:transparent!important;padding:6px 0}
.rsum{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:15px;font-family:var(--font-num);padding-top:6px}
.redit{display:flex;flex-direction:column;gap:8px;min-width:0}
.leg{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.lt{font:inherit;font-weight:700;min-height:48px;border-radius:6px;border:2px solid var(--line-strong);background:var(--bg);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.lt.as{cursor:pointer}
.leg.pick.on .lt{border-color:var(--pick);color:var(--pick);background:var(--pick-soft)}
.leg.drop.on .lt{border-color:var(--drop);color:var(--drop);background:var(--drop-soft)}
.lf{display:grid;grid-template-columns:minmax(100px,1fr) minmax(120px,1.2fr) 7.6em 7.6em minmax(110px,1.3fr);gap:8px;align-items:end;min-width:0}
.lf select,.lf input[type=text]{width:100%}
.lf label.f{font-size:12px}
.lbl{white-space:nowrap;line-height:1.4}
.own{display:inline-block;line-height:1.4;font-size:11px;padding:0 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.oform{display:flex;flex-direction:column;gap:12px;border:2px solid var(--accent);border-radius:var(--r);padding:14px}
/* 利用者管理 */
.wk td{white-space:nowrap}
.wk .t{font-family:var(--font-num);font-size:13px;line-height:1.45}
.wk .t .p{color:var(--pick)} .wk .t .d{color:var(--drop)}
.editor{border:2px solid var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table.week{border-collapse:collapse;min-width:640px}
table.week th,table.week td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.week th{font-size:13px;color:var(--muted)}
table.week td.dn{font-weight:700;font-size:18px;width:2.5em}
table.week .gp{border-left:3px solid var(--pick)}
table.week .gd{border-left:3px solid var(--drop)}
table.week td.off input[type=time]{opacity:.4}
.pat{border:1px solid var(--line-strong);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-weight:700;min-height:40px;padding:0 14px;border:0;background:var(--bg);color:var(--fg);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.dpick{display:inline-flex;gap:4px;flex-wrap:wrap}
.dpick button{font:inherit;font-weight:700;width:48px;height:44px;border-radius:6px;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);cursor:pointer}
.dpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;border-radius:99px;background:var(--accent-soft);font-weight:700;font-family:var(--font-num)}
.dchip button{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;font-size:16px}
.plegs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.plg{border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.plg.pick{background:var(--pick-soft)}.plg.drop{background:var(--drop-soft)}
.plg.off{background:var(--surface)}.plg.off .row:last-child{opacity:.45}
.pl{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline;padding:3px 0}
.pl+.pl{border-top:1px dashed var(--line)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 12px;font-weight:700;font-size:14px}
/* 送迎表 */
.tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs.type button[data-v="pick"][aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--bg)}
.tabs.type button[data-v="drop"][aria-pressed="true"]{background:var(--drop);border-color:var(--drop);color:var(--bg)}
table.sheet{border-collapse:collapse;width:100%;min-width:780px}
table.sheet th,table.sheet td{border:1px solid var(--line-strong);padding:6px 8px;vertical-align:middle}
table.sheet th{background:var(--surface);font-size:14px;white-space:nowrap}
table.sheet td.dt{white-space:nowrap;font-weight:700;font-family:var(--font-num)}
table.sheet td.dt.sat{color:var(--drop)}
table.sheet .c{text-align:center;font-family:var(--font-num)}
table.sheet tr.none td{color:var(--muted);background:var(--surface)}
/* 印刷プレビュー・送迎表（紙は両テーマとも白地に黒。元のExcelの色・罫線を再現） */
.desk{background:var(--desk);border-radius:var(--r);padding:16px;overflow:auto;max-height:80vh}
.desk .papers{display:flex;flex-direction:column;align-items:center;gap:16px;width:max-content;margin:0 auto}
.pg{width:297mm;height:210mm;padding:19.05mm 8.89mm 14.73mm 14.22mm;background:#fff;color:#000;box-shadow:0 1px 4px rgba(0,0,0,.25);overflow:hidden}
.paperbg{background:#fff;border:1px solid var(--line-strong);border-radius:var(--r);padding:12px}
.xlscreen{min-width:980px}
.xlt{width:100%;border-collapse:collapse;table-layout:fixed;font-family:"Yu Gothic","YuGothic","游ゴシック","BIZ UDPGothic",sans-serif;font-size:10pt;color:#000;background:#fff}
.xlt td{border:1px solid #000;height:5.82mm;padding:0 1mm;text-align:center;vertical-align:middle;white-space:nowrap;overflow:hidden;color:#000;font-variant-numeric:tabular-nums}
.xlt td.l{text-align:left}
.xlt tr.r1 td{border:0;background:#9dc3e6;font-weight:700;height:5.82mm}
.xlt tr.r2 td{border:0;height:3.39mm;padding:0}
.xlt tr.r3 td{font-weight:700}
.xlt td.hp{background:#deebf7}
.xlt td.hd{background:#fbe5d6}
.xlt tr.r4 td{background:#d9d9d9;border-bottom:0;height:6.09mm}
.xlt tr.gf td{border-top:2px solid #000}
.xlt tr.gl td{border-bottom:2px solid #000;height:6.09mm}
.xlt tr:not(.r1):not(.r2):not(.r3):not(.r4):not(.pad) td.a{border-left:2px solid #000}
.xlt tr:not(.r1):not(.r2):not(.r3):not(.r4):not(.pad) td.n{border-right:2px solid #000}
.xlt tr.t0 td{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:var(--r);font-weight:700;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:900px){
  .rrow{grid-template-columns:1fr}
  .lf{grid-template-columns:1fr 1fr}
  .lf label.f:last-child{grid-column:1/-1}
}
@media (max-width:600px){
  .leg{grid-template-columns:1fr}
  .lt{min-height:44px}
  .savebar .btn{flex:1}
  .savebar .state{flex-basis:100%}
  .dayhead .wday{font-size:18px}
}
@media (max-width:760px){
  .today{font-size:26px}
  nav a{padding:10px 10px;font-size:14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .card .nm{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar"><span class="brand">送迎管理</span><span id="mode" class="mode">読み込み中</span></div>
    <nav id="nav">
      <a href="#home">ホーム</a>
      <a href="#day">毎日の送迎入力</a>
      <a href="#clients">利用者・レギュラー登録</a>
      <a href="#vehicles">車両・基本運転手</a>
      <a href="#drivers">運転手登録</a>
      <a href="#sheet">送迎表・Excel出力</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><p class="note">データを読み込んでいます…</p></main>

 vehicles/<id> { name, order, driver, helper }            … 既定の担当者
 days/<YYYY-MM-DD>  作成した日の送迎表。名前・時間・車両をすべて写して保存するため、
                 後で利用者の登録内容を変えても過去の送迎表は変わらない。
   { date, savedAt,
     trips:[ { id, type:"pick"|"drop", vid, driver, helper, dep, arr, auto } ],   … 送迎便。運転手・添乗員は便ごと

     riders:[ { key, cid, name, extra,
                pick:{on,dep,arr,vid,tid,driver,helper,note}, drop:{…} } ] }
       … tid＝乗る便。driver/helper が空なら便の運転手・添乗員、入っていればその利用者だけの設定。
       … other:true は「その他」から当日だけ追加した人（レギュラー登録には入れない）
*/
const WD=['sun','mon','tue','wed','thu','fri','sat'];
const WDJ=['日','月','火','水','木','金','土'];
const WORK=['mon','tue','wed','thu','fri','sat'];
const TYPES=[['pick','お迎え'],['drop','お送り']];
const TL={pick:'お迎え',drop:'お送り'};
const COLLS=['clients','staff','vehicles','days'];
const LS_KEY='sogei-data-v1';
const LINES_PER_PAGE=32;

const S={clients:{},staff:{},vehicles:{},days:{}};
let db=null, mode='loading', downloads=null;
const ui={view:'home',date:todayStr(),month:todayStr().slice(0,7),sheetVid:null,sheetType:'pick',
  editClient:null,arm:null,day:null,dayDirty:false,addName:'',restore:null,preview:null,busy:false};

/* ---------- 汎用 ---------- */
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d)}
function wdKey(s){return WD[parseD(s).getDay()]}
function wdJ(s){return WDJ[parseD(s).getDay()]}
function longDate(s){const d=parseD(s);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+WDJ[d.getDay()]+'）'}
function shortDate(s){const d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+WDJ[d.getDay()]+'）'}
function t(s){if(!s)return '';const [h,m]=s.split(':');return Number(h)+':'+m}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clone(x){return JSON.parse(JSON.stringify(x??null))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800)}
function monthLabel(ym){const [y,m]=ym.split('-').map(Number);return y+'年'+m+'月'}

/* ---------- 保存 ---------- */
const queues={};
function persistLocal(){if(mode!=='local')return;try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function put(c,id,data){
  S[c]={...S[c],[id]:data};
  if(mode==='shared'){
    const k=c+'/'+id;
    queues[k]=(queues[k]||Promise.resolve()).then(()=>db.collection(c).doc(id).set(data)).catch(dbErr);
    return queues[k];
  }
  persistLocal();return Promise.resolve();
}
function del(c,id){
  const o={...S[c]};delete o[id];S[c]=o;
  if(mode==='shared'){const k=c+'/'+id;queues[k]=(queues[k]||Promise.resolve()).then(()=>db.collection(c).doc(id).delete()).catch(dbErr)}
  else persistLocal();
}
function dbErr(e){
  const m={quota_exceeded:'保存容量の上限に達しました。古い送迎表を削除してください。',
    invalid_argument:'このアカウントには編集権限がありません。共有設定で「投稿者」以上が必要です。',
    resource_exhausted:'操作が集中しています。少し待ってからやり直してください。'};
  toast(m[e&&e.code]||'保存できませんでした。通信状態を確認してください。');
}
async function initStore(){
  const use=window.claude&&window.claude.use?n=>window.claude.use(n).catch(()=>null):()=>Promise.resolve(null);
  [db,downloads]=await Promise.all([use('db'),use('downloads')]);
  if(db){
    mode='shared';
    COLLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[c]=o;scheduleRender()},
        ()=>toast('共有データとの接続が切れました。ページを再読み込みしてください。'));
    });
  }else{
    mode='local';
    try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);COLLS.forEach(c=>S[c]=o[c]||{})}}catch(e){}
  }
  render();
}
let pendingRender=false;
function scheduleRender(){
  const a=document.activeElement;
  if(a&&document.getElementById('main').contains(a)&&/INPUT|SELECT/.test(a.tagName)){pendingRender=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(pendingRender){pendingRender=false;scheduleRender()}},0)});

/* ---------- 参照 ---------- */
function vehicles(){
  const v=Object.entries(S.vehicles).map(([id,x])=>({id,...x}));
  if(!v.length)return [{id:'v1',name:'車両1',order:1,driver:'',helper:''},{id:'v2',name:'車両2',order:2,driver:'',helper:''}];
  return v.sort((a,b)=>(a.order||0)-(b.order||0));
}
function firstVid(){return vehicles()[0].id}
function vname(id){const v=vehicles().find(x=>x.id===id);return v?v.name:'未割当'}
function clients(){return Object.entries(S.clients).map(([id,x])=>({id,...x})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'))}
function staff(){return Object.entries(S.staff).map(([id,x])=>({id,...x})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'))}
function staffFor(role){
  if(role==='driver')return driverSlots().filter(s=>s&&s.name&&s.active!==false);
  return staff().filter(s=>s.role!=='driver'&&s.active!==false);
}
function clientVid(c){const v=c.vid||c.pickVid;return vehicles().some(x=>x.id===v)?v:firstVid()}
/* ===== レギュラー登録（送迎パターン） =====
 clients/<id>.patterns = [ { id, mode:"week"|"date", days:["mon",…], dates:["2026-11-05",…],
                             pick:{on,dep,arr}, drop:{on,dep,arr}, vid, note } ]
 毎日・曜日固定・月1回の人もすべてこの形で登録する。
 その日の内容の決め方：その日付を指定したパターンを優先（その日だけの設定）→ なければ曜日のパターン。 */
const PWD=['mon','tue','wed','thu','fri','sat','sun'];
function oldLeg(s,k){const v=s[k];
  if(v&&typeof v==='object')return {on:!!v.on,dep:v.dep||'',arr:v.arr||''};
  if(typeof v==='string')return {on:!!s.on&&!!v,dep:'',arr:v};
  return {on:false,dep:'',arr:''}}
function normPat(p,c){const L=x=>({on:!!(x&&x.on),dep:(x&&x.dep)||'',arr:(x&&x.arr)||'',driver:(x&&x.driver)||''});
  return {id:p.id||uid('p'),mode:p.mode==='date'?'date':'week',days:[...(p.days||[])],dates:[...(p.dates||[])].sort(),
    pick:L(p.pick),drop:L(p.drop),vid:vehicles().some(v=>v.id===p.vid)?p.vid:clientVid(c),note:p.note||''}}
function patternsOf(c){
  if(Array.isArray(c.patterns))return c.patterns.map(p=>normPat(p,c));
  // 以前の「曜日ごとの表」の登録を読み替える（同じ内容の曜日は1つのパターンにまとめる）
  const out=[],sch=c.schedule||{};
  WORK.forEach(wd=>{const s=sch[wd]||{},pick=oldLeg(s,'pick'),drop=oldLeg(s,'drop');if(!pick.on&&!drop.on)return;
    const key=JSON.stringify([pick,drop]),q=out.find(x=>x.key===key);
    if(q)q.p.days.push(wd);else out.push({key,p:{id:'p'+out.length,mode:'week',days:[wd],dates:[],pick,drop,vid:clientVid(c),note:''}})});
  return out.map(x=>normPat(x.p,c));
}
function patternFor(c,date){
  const ps=patternsOf(c),wd=wdKey(date);
  return ps.find(p=>p.mode==='date'&&p.dates.includes(date))||ps.find(p=>p.mode==='week'&&p.days.includes(wd))||null;
}
function scheduledOnDate(c,date){const p=patternFor(c,date);return !!(p&&(p.pick.on||p.drop.on))}
/* その日の迎え／送りの内容。予定がない日（臨時）は、その迎え／送りがある最初のパターンを使う */
function legFor(c,date,k){
  const p=scheduledOnDate(c,date)?patternFor(c,date):patternsOf(c).find(q=>q[k].on);
  return p?{...p[k],vid:p.vid,note:p.note}:{on:false,dep:'',arr:'',driver:'',vid:clientVid(c),note:''};
}
function defaultLegs(c,date){
  const all=TYPES.map(([k])=>k);
  if(scheduledOnDate(c,date)){const p=patternFor(c,date);return all.filter(k=>p[k].on)}
  const legs=all.filter(k=>patternsOf(c).some(q=>q[k].on));return legs.length?legs:all;
}
function upcomingDates(c,from){return [...new Set(patternsOf(c).filter(p=>p.mode==='date').flatMap(p=>p.dates))].filter(d=>d>=from).sort()}

/* ---------- 当日データ ---------- */
/* 利用者1人ごと・迎え／送りごとに、車両・運転手・時間を持つ。
   利用者を選ぶと：基本車両 → その車両の基本運転手 → 曜日・日付の時間 が入る。 */
function vehOf(id){return vehicles().find(v=>v.id===id)||vehicles()[0]}
function baseDriver(vid){return vehOf(vid).driver||''}
function baseHelper(vid){return vehOf(vid).helper||''}
function normLeg(L,vid){L=L||{};if(L.time&&!L.arr)L.arr=L.time;
  return {on:!!L.on,dep:L.dep||'',arr:L.arr||'',vid:L.vid||vid,tid:L.tid||'',driver:L.driver||'',helper:L.helper||'',note:L.note||''}}
function normalizeDay(d){
  d.riders=(d.riders||[]).map(r=>{const fv=firstVid();r.pick=normLeg(r.pick,fv);r.drop=normLeg(r.drop,fv);
    if(r.note&&!r.pick.note&&!r.drop.note){r.pick.note=r.note;r.drop.note=r.note}delete r.note;return r});
  // 以前の保存形式（車両ごと・便ごとの運転手）は、各利用者の欄に写して読み替える（内容は変わらない）
  const old=d.trips;
  if(old)d.riders.forEach(r=>TYPES.forEach(([k])=>{const L=r[k];if(!L.on)return;
    const tr=Array.isArray(old)?old.find(x=>x.id===L.tid):(old[L.vid]||{})[k];if(!tr)return;
    if(Array.isArray(old)&&tr.vid)L.vid=tr.vid;
    L.driver=L.driver||tr.driver||'';L.helper=L.helper||tr.helper||'';L.dep=L.dep||tr.dep||'';L.arr=L.arr||tr.arr||''}));
  delete d.trips;d.riders.forEach(r=>TYPES.forEach(([k])=>delete r[k].tid));
  return d;
}
function buildDay(date){return normalizeDay({date,riders:[]})}
function ensureDay(){
  const saved=S.days[ui.date];
  // 手を加えていない間は、保存済みの内容（なければ空の表）を表示し直す
  if(!ui.day||ui.day.date!==ui.date||!ui.dayDirty){ui.day=saved?normalizeDay(clone(saved)):buildDay(ui.date);ui.dayDirty=false}
}
function makeRider(c,date,legs){
  const p=patternFor(c,date),extra=!scheduledOnDate(c,date);
  const r={key:uid('r'),cid:c.id,name:c.name,extra,byDate:!extra&&p.mode==='date'};
  TYPES.forEach(([k])=>{const L=legFor(c,date,k);
    r[k]={on:legs.includes(k),dep:L.dep,arr:L.arr,vid:L.vid,driver:L.driver||baseDriver(L.vid),helper:baseHelper(L.vid),
      note:[L.note,c.note].filter(Boolean).join('　')}});
  return r;
}
/* 車両ごとの一覧（Excelなど）：出発時間の順 */
function legRiders(day,vid,type){
  return (day.riders||[]).filter(r=>r[type].on&&r[type].vid===vid)
    .sort((a,b)=>(a[type].dep||a[type].arr||'99').localeCompare(b[type].dep||b[type].arr||'99'));
}
function findR(k){return ui.day.riders.find(r=>r.key===k)}
function riderOf(cid){return ui.day.riders.find(r=>r.cid===cid)}
function pruneRider(r){if(!r.pick.on&&!r.drop.on)ui.day.riders=ui.day.riders.filter(x=>x!==r)}

/* ---------- 描画 ---------- */
function render(){
  pendingRender=false;
  const m=document.getElementById('mode');
  m.className='mode '+mode;
  m.textContent=mode==='shared'?'共有データに保存':mode==='local'?'この端末のみに保存':'読み込み中';
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+ui.view?'page':'false'));
  const sy=window.scrollY;
  document.getElementById('main').innerHTML=({home:vHome,day:vDay,sheet:vSheet,clients:vClients,vehicles:vVehicles,drivers:vDrivers}[ui.view]||vHome)();
  document.getElementById('savebar').innerHTML=ui.view==='day'?saveBar():'';
  window.scrollTo(0,sy);
}

function counts(d){return {p:d.riders.filter(r=>r.pick&&r.pick.on).length,q:d.riders.filter(r=>r.drop&&r.drop.on).length}}
function vHome(){

  let st='<span class="state dirty">本日の送迎表はまだ作成されていません</span>';

    <a class="tile" href="#vehicles"><b>車両・基本運転手</b><span>${vehicles().map(v=>esc(v.name)+'：'+esc(v.driver||'未設定')).join('　')}</span></a>
    <a class="tile" href="#drivers"><b>運転手登録</b><span>${driverSlots().filter(Boolean).length}名</span></a>
    <a class="tile" href="#sheet"><b>送迎表・Excel出力</b><span>月間の送迎表・Excel・PDF</span></a>
  </div>
  <div class="panel soft stack">
    <h2>バックアップ</h2>
    <p class="note" style="margin:0">登録内容と送迎表を1つのファイルに保存します。月に一度の保存をおすすめします。</p>

      <div class="row"><button class="btn danger armed" data-act="restore-go">上書きして復元</button><button class="btn" data-act="restore-cancel">やめる</button></div></div>`:''}

  </div></div>`;

/* ----- 毎日の送迎入力 ----- */
function staffSelect(role,val,attrs,blank){
  const list=staffFor(role),names=list.map(s=>s.name);
  let o=`<option value="">${blank||(role==='helper'?'なし':'未選択')}</option>`+list.map(s=>`<option ${s.name===val?'selected':''}>${esc(s.name)}</option>`).join('');
  if(val&&!names.includes(val))o+=`<option selected>${esc(val)}</option>`;
  return `<select ${attrs}>${o}</select>`;
}
function vehSelect(sel,attrs){return `<select ${attrs}>${vehicles().map(v=>`<option value="${v.id}" ${v.id===sel?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`}
function timeRange(L){return L.dep||L.arr?`${t(L.dep)||'--:--'}→${t(L.arr)||'--:--'}`:'時間未設定'}
/* 迎え／送り1行分の入力欄：車両・運転手・出発・到着・備考 */
function legLine(r,k){
  const L=r[k],on=L.on,a=f=>`data-in="leg" data-k="${r.key}" data-t="${k}" data-f="${f}"`,nm=esc(r.name)+'の'+TL[k];
  const own=on&&L.driver!==baseDriver(L.vid);
  return `<div class="leg ${k} ${on?'on':'off'}">
    <button class="lt" data-act="legtog" data-k="${r.key}" data-t="${k}" aria-pressed="${on}">${on?'✓ ':''}${TL[k]}</button>
    ${on?`<div class="lf">
      <label class="f">車両${vehSelect(L.vid,`data-ch="legveh" data-k="${r.key}" data-t="${k}" aria-label="${nm}の車両"`)}</label>
      <label class="f"><span class="lbl">運転手${own?' <span class="own">個別</span>':''}</span>${staffSelect('driver',L.driver,`${a('driver')} aria-label="${nm}の運転手"`,'未定')}</label>
      <label class="f">出発<input type="time" value="${L.dep}" ${a('dep')} aria-label="${nm}の出発時間"></label>
      <label class="f">到着<input type="time" value="${L.arr}" ${a('arr')} aria-label="${nm}の到着時間"></label>
      <label class="f">備考<input type="text" value="${esc(L.note)}" ${a('note')} aria-label="${nm}の備考"></label>
    </div>`:'<span class="note">なし</span>'}
  </div>`;
}
function legSummary(L){return L.on?`${t(L.dep)||'--:--'}→${t(L.arr)||'--:--'}　${esc(vname(L.vid))}・${esc(L.driver||'運転手未定')}`:'なし'}
/* 当日送迎ありの1人分。選ぶ前は予定の要約、選んだ後はその場で変更できる */
function riderRow(c){
  const r=riderOf(c.id),sel=!!r;
  if(!sel){
    const legs=defaultLegs(c,ui.date),pv=k=>{const L=legFor(c,ui.date,k);return {...L,on:legs.includes(k),driver:L.driver||baseDriver(L.vid)}};
    const p=patternFor(c,ui.date);
    return `<div class="rrow">
      <button class="rname" data-act="pickname" data-cid="${c.id}" aria-pressed="false"><span class="ck"></span>${esc(c.name)}</button>
      <div class="rsum">${p&&p.mode==='date'?'<span class="tag extra">日付指定</span>':''}
        <span><span class="tag pick">迎</span> ${legSummary(pv('pick'))}</span>
        <span><span class="tag drop">送</span> ${legSummary(pv('drop'))}</span></div>
    </div>`;
  }
  return `<div class="rrow sel">
    <button class="rname" data-act="pickname" data-cid="${c.id}" aria-pressed="true"><span class="ck">✓</span>${esc(c.name)}</button>
    <div class="redit">${legLine(r,'pick')}${legLine(r,'drop')}</div>
  </div>`;
}
function otherRow(r){
  return `<div class="rrow sel">
    <div class="rname static"><span>${esc(r.name)}</span><span class="tag extra">その他</span>
      <button class="btn small danger" data-act="otherdel" data-k="${r.key}">取り消す</button></div>
    <div class="redit">${legLine(r,'pick')}${legLine(r,'drop')}</div>
  </div>`;
}
function vDay(){
  ensureDay();
  const d=ui.day,today=clients().filter(c=>scheduledOnDate(c,ui.date));
  const others=d.riders.filter(r=>r.other||!r.cid||!today.some(c=>c.id===r.cid));
  const cnt=counts(d),picked=today.filter(c=>riderOf(c.id)).length;
  return `<div class="stack">
  <div class="dayhead">
    <button class="btn" data-act="dshift" data-n="-1" aria-label="前の日">◀</button>

    <span class="wday">${wdJ(ui.date)}曜日</span>
    <button class="btn" data-act="dshift" data-n="1" aria-label="次の日">▶</button>
    <button class="btn small" data-act="dtoday">今日</button>
    <span class="spacer"></span>
    <span class="cnt"><span class="tag pick">お迎え ${cnt.p}名</span><span class="tag drop">お送り ${cnt.q}名</span></span>
  </div>

  <section class="block">
    <div class="bh"><h2>当日送迎あり</h2><span class="note">${picked} / ${today.length}名 追加済み</span><span class="spacer"></span>
      ${today.length&&picked<today.length?`<button class="btn small" data-act="allon">全員を追加</button>`:''}</div>
    ${today.length?`<p class="hint">名前を押すと送迎表に追加されます。車両・運転手・時間は自動で入ります。</p><div class="rlist">${today.map(riderRow).join('')}</div>`
      :`<div class="empty">この日にレギュラー登録の送迎予定はありません。</div>`}

/* ----- 帳票（プレビュー・PDF・印刷用ファイル）。A4横・元のExcelの余白に合わせる ----- */
const ROW_MM=5.82,ROWL_MM=6.09,HEAD_MM=21.2,BODY_MM=176.2;
function paperPages(scope){
  const vs=scope==='one'?[vehicles().find(v=>v.id===ui.sheetVid)]:vehicles(),out=[];
  vs.forEach(v=>{
    const groups=excelGroups(ui.month,v.id),pages=[[]];let used=HEAD_MM;
    groups.forEach(g=>{const n=Math.max(g.pick.length,g.drop.length),h=(n-1)*ROW_MM+ROWL_MM;
      if(used+h>BODY_MM&&pages[pages.length-1].length){pages.push([]);used=0}
      pages[pages.length-1].push(g);used+=h});
    const tailFits=used+10*ROW_MM<=BODY_MM;
    pages.forEach((p,i)=>out.push(`<div class="pg">${xlTable(v,p,i===0,i===pages.length-1&&tailFits)}</div>`));
  });
  return out;
}

  catch(e){if(e&&e.code==='declined')return false;if(e&&e.code==='rate_limited'){toast('保存の確認画面がすでに開いています');return false}toast('保存できませんでした');return false}

/* ----- Excel出力：元ファイルをテンプレートとして使い、5行目以降だけを差し替える ----- */
const XL={ // 元ファイルの書式番号（1日の1行目／途中／最終行／表の下の空欄）
  first:[8,9,9,9,10,10,11,9,9,9,9,19,19,12], mid:[22,3,3,3,7,7,5,20,3,3,3,4,4,18],
  last:[21,14,14,14,15,15,17,14,14,14,14,23,23,16], after:[33,28,28,29,30,30,31,33,28,28,29,32,32,31],
  plain:[20,3,3,6,7,7,5,20,3,3,6,4,4,5], pad:Array(14).fill(24)};
const XCOLS='ABCDEFGHIJKLMN'.split('');
function b64u8(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function xesc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function xSerial(date){const [y,m,d]=date.split('-').map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5}
function xTime(s){if(!s)return null;const [h,m]=s.split(':').map(Number);return +((h*60+m)/1440).toFixed(15)}
function xCell(col,r,s,v){const ref=col+r;
  if(v==null||v==='')return `<c r="${ref}" s="${s}"/>`;
  if(typeof v==='number')return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;
  return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`}
function xRow(r,sty,vals,thick){return `<row r="${r}" spans="1:14"${thick?' ht="17.25" thickBot="1" x14ac:dyDescent="0.45"':' x14ac:dyDescent="0.4"'}>${XCOLS.map((c,i)=>xCell(c,r,sty[i],vals[i])).join('')}</row>`}
/* 1行だけの日用：1行目の書式に下の太線を加えた書式を追加する（元の書式は変えない） */
function xSingleStyles(styles){
  const bm=styles.match(/<borders count="\d+">([\s\S]*?)<\/borders>/),xm=styles.match(/<cellXfs count="\d+">([\s\S]*?)<\/cellXfs>/);
  const borders=bm[1].match(/<border>[\s\S]*?<\/border>|<border\/>/g),xfs=xm[1].match(/<xf [^>]*\/>|<xf [^>]*>[\s\S]*?<\/xf>/g);
  const nb=[],nx=[],map={};
  XL.first.forEach(sid=>{if(map[sid]!=null)return;const x=xfs[sid],bid=+x.match(/borderId="(\d+)"/)[1];
    nb.push(borders[bid].replace(/<bottom style="thin">/,'<bottom style="medium">').replace(/<bottom\/>/,'<bottom style="medium"><color indexed="64"/></bottom>'));
    nx.push(x.replace(/borderId="\d+"/,`borderId="${borders.length+nb.length-1}"`));map[sid]=xfs.length+nx.length-1});
  styles=styles.replace(bm[0],()=>`<borders count="${borders.length+nb.length}">${bm[1]}${nb.join('')}</borders>`)
               .replace(xm[0],()=>`<cellXfs count="${xfs.length+nx.length}">${xm[1]}${nx.join('')}</cellXfs>`);
  return {styles,single:XL.first.map(s=>map[s])};
}
async function buildXlsx(vid){
  const v=vehicles().find(x=>x.id===vid),[,mm]=ui.month.split('-').map(Number);
  const zip=await JSZip.loadAsync(b64u8(document.getElementById('tpl').textContent.trim()));
  let sh=await zip.file('xl/worksheets/sheet1.xml').async('string');
  const {styles,single}=xSingleStyles(await zip.file('xl/styles.xml').async('string'));
  // 見出し（1〜4行目）は元のまま。タイトルの車両番号だけ差し替える
  const head=[1,2,3,4].map(n=>sh.match(new RegExp(`<row r="${n}"[^>]*?(?:/>|>[\\s\\S]*?</row>)`))[0]);
  head[0]=head[0].replace(/<c r="A1"([^>]*?) t="s"><v>\d+<\/v><\/c>/,(m,a)=>`<c r="A1"${a} t="inlineStr"><is><t xml:space="preserve">${xesc(xlTitle(v))}</t></is></c>`);
  const rows=[];let r=5;
  excelGroups(ui.month,vid).forEach(g=>{const n=Math.max(g.pick.length,g.drop.length);
    for(let i=0;i<n;i++){const p=g.pick[i],q=g.drop[i];
      const vals=[i===0?xSerial(g.date):null,p?p.driver:null,p?p.helper:null,p?p.name:null,p?xTime(p.dep):null,p?xTime(p.arr):null,p?p.note:null,
                  null,q?q.driver:null,q?q.helper:null,q?q.name:null,q?xTime(q.dep):null,q?xTime(q.arr):null,q?q.note:null];
      rows.push(xRow(r++,n===1?single:i===0?XL.first:i===n-1?XL.last:XL.mid,vals,i===n-1))}});
  rows.push(xRow(r++,XL.after,[],false));
  for(let i=0;i<4;i++)rows.push(xRow(r++,XL.plain,[],false));
  for(let i=0;i<5;i++)rows.push(xRow(r++,XL.pad,[],false));
  sh=sh.replace(/<sheetData>[\s\S]*<\/sheetData>/,()=>`<sheetData>${head.join('')}${rows.join('')}</sheetData>`)
       .replace(/<dimension ref="[^"]*"\/>/,`<dimension ref="A1:N${r-1}"/>`)
       .replace(/ topLeftCell="[^"]*"/,'').replace(/<selection [^>]*\/>/,'<selection activeCell="A5" sqref="A5"/>');
  zip.file('xl/worksheets/sheet1.xml',sh);
  zip.file('xl/styles.xml',styles);
  let wbx=await zip.file('xl/workbook.xml').async('string');
  wbx=wbx.replace(/<mc:AlternateContent[\s\S]*?<\/mc:AlternateContent>/,'').replace(/<sheet name="[^"]*"/,`<sheet name="${mm}月"`);
  zip.file('xl/workbook.xml',wbx);
  let app=await zip.file('docProps/app.xml').async('string');
  app=app.replace(/(<TitlesOfParts>[\s\S]*?<vt:lpstr>)[^<]*(<\/vt:lpstr>)/,(m,a,b)=>a+mm+'月'+b);
  zip.file('docProps/app.xml',app);
  return zip.generateAsync({type:'blob',compression:'DEFLATE'});
}
async function exportXlsx(){
  if(!window.JSZip){toast('Excel出力の部品を読み込めませんでした。ページを再読み込みしてください。');return}
  try{const blob=await buildXlsx(ui.sheetVid);
    const [y,m]=ui.month.split('-').map(Number);
    await saveFile(`送迎管理（${vname(ui.sheetVid)}）${y}年${m}月.xlsx`,blob)}
  catch(e){toast('Excelを作成できませんでした')}
}

function patWhen(p){return p.mode==='week'?(p.days.length?`毎週 ${wdLabel(p.days)}`:'曜日未選択'):(p.dates.length?`日付 ${p.dates.map(md).join('・')}`:'日付未選択')}
function patLegs(p){const f=(L,lab,cls)=>`<span class="${cls}">${lab} ${L.on?`${t(L.dep)||'--'}→${t(L.arr)||'--'}${L.driver?'（'+esc(L.driver)+'）':''}`:'なし'}</span>`;return f(p.pick,'迎','p')+'　'+f(p.drop,'送','d')}
function vClients(){

function patEditor(p,i){
  const a=(g,f)=>`data-in="pat" data-i="${i}"${g?` data-g="${g}"`:''} data-f="${f}"`;
  const leg=(g,l)=>{const L=p[g];return `<div class="plg ${g} ${L.on?'':'off'}">
    <label class="row" style="gap:6px"><input type="checkbox" id="p_${i}_${g}_on" ${a(g,'on')} ${L.on?'checked':''}> <span class="tag ${g}">${l}</span> 利用する</label>
    <div class="row"><label class="f">出発時間<input type="time" id="p_${i}_${g}_dep" value="${L.dep}" ${a(g,'dep')}></label>
    <label class="f">到着時間<input type="time" id="p_${i}_${g}_arr" value="${L.arr}" ${a(g,'arr')}></label>
    <label class="f">基本の運転手${staffSelect('driver',L.driver,`id="p_${i}_${g}_driver" ${a(g,'driver')}`,'車両の基本運転手')}</label></div></div>`};
  return `<div class="pat">
    <div class="row"><h3>パターン${i+1}</h3>
      <span class="seg" role="group" aria-label="指定のしかた"><button data-act="pmode" data-i="${i}" data-m="week" aria-pressed="${p.mode==='week'}">曜日で指定</button><button data-act="pmode" data-i="${i}" data-m="date" aria-pressed="${p.mode==='date'}">日付で指定</button></span>
      <span class="spacer"></span><button class="btn small" data-act="pdup" data-i="${i}">複製</button><button class="btn small danger" data-act="pdel" data-i="${i}">このパターンを削除</button></div>
    ${p.mode==='week'?`<div class="row"><span class="note">利用する曜日</span><span class="dpick">${PWD.map(d=>`<button data-act="pday" data-i="${i}" data-d="${d}" aria-pressed="${p.days.includes(d)}">${WDJ[WD.indexOf(d)]}</button>`).join('')}</span></div>`
    :`<div class="row"><span class="note">送迎する日付</span><input type="date" id="pd_${i}" aria-label="追加する日付"><button class="btn small" data-act="pdateadd" data-i="${i}">日付を追加</button>
      ${p.dates.map(d=>`<span class="dchip">${shortDate(d)}<button data-act="pdatedel" data-i="${i}" data-v="${d}" aria-label="${shortDate(d)}を外す">×</button></span>`).join('')||'<span class="note">まだ日付がありません</span>'}</div>`}
    <div class="plegs">${leg('pick','お迎え')}${leg('drop','お送り')}</div>
    <div class="fgrid"><label class="f">利用する車両${vehSelect(p.vid,`id="p_${i}_vid" ${a('','vid')}`)}</label>
      <label class="f">このパターンの備考<input type="text" id="p_${i}_note" value="${esc(p.note)}" ${a('','note')} placeholder="例：通院の日"></label></div>
  </div>`;
}
function patWarnings(e){
  const w=[],seen={};
  e.patterns.forEach((p,i)=>(p.mode==='week'?p.days.map(d=>'w'+d):p.dates.map(d=>'d'+d)).forEach(k=>{if(seen[k]!=null&&seen[k]!==i)w.push(`${k[0]==='w'?WDJ[WD.indexOf(k.slice(1))]+'曜日':shortDate(k.slice(1))}がパターン${seen[k]+1}とパターン${i+1}で重なっています（パターン${seen[k]+1}が使われます）`);else seen[k]=i}));
  return w;
}
function clientEditor(e){
  const warn=patWarnings(e);
  return `<div class="editor">
  <h2>${e.id?'利用者を編集':'利用者を追加'}</h2>
  <div class="fgrid">
    <label class="f">利用者名<input type="text" id="c_name" value="${esc(e.name)}" data-in="c" data-f="name" placeholder="例：山田 太郎"></label>
    <label class="f">基本の車両${vehSelect(e.vid,'id="c_vid" data-in="c" data-f="vid"')}</label>
    <label class="f">備考（送迎表の備考欄に入ります）<input type="text" id="c_note" value="${esc(e.note)}" data-in="c" data-f="note" placeholder="例：車いす"></label>
  </div>
  <div class="stack" style="gap:6px"><h3>送迎パターン</h3>
    <p class="note" style="margin:0">曜日で決まっている送迎は「曜日で指定」、月に1回など決まった日だけの送迎は「日付で指定」で登録します。同じ日に両方あるときは、日付で指定したパターンがその日だけ使われます。</p></div>
  ${e.patterns.map(patEditor).join('')||'<div class="empty">パターンがありません。下のボタンから追加してください。</div>'}
  <div class="row"><button class="btn" data-act="padd" data-m="week">＋ 曜日のパターンを追加</button><button class="btn" data-act="padd" data-m="date">＋ 日付のパターンを追加</button></div>
  ${warn.length?`<div class="warnbox">${warn.map(esc).join('<br>')}</div>`:''}
  <div class="row">
    <button class="btn primary" data-act="csave">保存</button><button class="btn" data-act="ccancel">閉じる</button><span class="spacer"></span>
    ${e.id?`<button class="btn danger ${ui.arm==='c'+e.id?'armed':''}" data-act="cdel">${ui.arm==='c'+e.id?'本当に削除する':'この利用者を削除'}</button>`:''}
  </div>
  <p class="note" style="margin:0">登録内容を変えても、すでに作成した送迎表は変わりません。</p></div>`;
}

function driverSlots(){return Array.from({length:MAX_DRIVERS},(_,i)=>{const s=S.staff['d'+(i+1)];return s&&s.role==='driver'?{id:'d'+(i+1),...s}:null})}
function saveVehicle(id,patch){const v=vehicles().find(x=>x.id===id);const {id:_,...rest}=v;put('vehicles',id,{...rest,...patch})}
function materializeVehicles(){if(!Object.keys(S.vehicles).length)vehicles().forEach(v=>{const {id,...r}=v;put('vehicles',id,r)})}

/* ---------- 操作 ---------- */
function go(view){if(location.hash!=='#'+view)location.hash=view;else{ui.view=view;render()}}
const ACT={
  goday(el,e){e.preventDefault();ui.date=el.dataset.date;ui.day=null;go('day')},
  dshift(el){ui.date=addDays(ui.date,+el.dataset.n);ui.day=null;ui.other=null;render()},
  dtoday(){ui.date=todayStr();ui.day=null;render()},
  pickname(el){const c=S.clients[el.dataset.cid]&&{id:el.dataset.cid,...S.clients[el.dataset.cid]};const r=riderOf(c.id);
    if(r&&(r.pick.on||r.drop.on)){ui.day.riders=ui.day.riders.filter(x=>x!==r)}
    else{if(r)ui.day.riders=ui.day.riders.filter(x=>x!==r);ui.day.riders.push(makeRider(c,ui.date,defaultLegs(c,ui.date)))}
    ui.dayDirty=true;render()},
  chip(el){const c={id:el.dataset.cid,...S.clients[el.dataset.cid]},k=el.dataset.t;let r=riderOf(c.id);
    if(!r){r=makeRider(c,ui.date,[k]);ui.day.riders.push(r)}else{r[k].on=!r[k].on;pruneRider(r)}
    ui.dayDirty=true;render()},
  legoff(el){const r=findR(el.dataset.k);r[el.dataset.t].on=false;pruneRider(r);ui.dayDirty=true;render()},
  allon(){clients().filter(c=>scheduledOnDate(c,ui.date)).forEach(c=>{const legs=defaultLegs(c,ui.date),r=riderOf(c.id);
    if(r)legs.forEach(k=>r[k].on=true);else ui.day.riders.push(makeRider(c,ui.date,legs))});
    ui.dayDirty=true;render()},
  alloff(){ui.day.riders=[];ui.dayDirty=true;render()},
  otheropen(){ui.other=newOther();render();setTimeout(()=>document.getElementById('o_name')?.focus(),0)},
  otherclose(){ui.other=null;render()},
  legtog(el){const r=findR(el.dataset.k),k=el.dataset.t,L=r[k];L.on=!L.on;
    if(L.on&&!L.driver){L.driver=baseDriver(L.vid);L.helper=L.helper||baseHelper(L.vid)}
    if(!r.pick.on&&!r.drop.on&&!r.other){ui.day.riders=ui.day.riders.filter(x=>x!==r)}ui.dayDirty=true;render()},
  otheradd(){const o=ui.other,n=o.name.trim();if(!n){toast('利用者名を入力してください');return}
    if(!o.pick.on&&!o.drop.on){toast('お迎え・お送りのどちらかを「あり」にしてください');return}
    const r={key:uid('r'),cid:o.cid||null,name:n,extra:true,other:true};
    TYPES.forEach(([k])=>{const L=o[k];r[k]={on:L.on,dep:L.dep,arr:L.arr,vid:L.vid,driver:L.driver,helper:L.helper,note:o.note.trim()}});
    ui.day.riders.push(r);ui.other=null;ui.dayDirty=true;render();toast(n+' さんを追加しました')},
  otherdel(el){ui.day.riders=ui.day.riders.filter(r=>r.key!==el.dataset.k);ui.dayDirty=true;render()},
  saveday(){const d=clone(ui.day);d.savedAt=new Date().toISOString();put('days',ui.date,d);ui.day=null;ui.dayDirty=false;render();toast(shortDate(ui.date)+' の送迎表を保存しました')},
  tosheet(){ui.month=ui.date.slice(0,7);go('sheet')},
  mshift(el){const [y,m]=ui.month.split('-').map(Number);const d=new Date(y,m-1+(+el.dataset.n),1);ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1);render()},
  svid(el){ui.sheetVid=el.dataset.v;render()},
  stype(el){ui.sheetType=el.dataset.v;render()},
  preview(el){ui.preview=el.dataset.scope;render();setTimeout(()=>document.getElementById('out')?.scrollIntoView({block:'start'}),0)},
  closepreview(){ui.preview=null;render()},
  pdf(){exportPdf()},
  printfile(){saveFile(outName('html'),printHTML(ui.preview))},
  htmlout(){const [y,m]=ui.month.split('-').map(Number);saveFile(`送迎管理（${vname(ui.sheetVid)}）${y}年${m}月.html`,printHTML('one'))},
  xlsx(){exportXlsx()},
  cnew(){ui.editClient=newClient();ui.arm=null;render();setTimeout(()=>document.getElementById('c_name')?.focus(),0)},
  cedit(el){const c=S.clients[el.dataset.id],e=newClient();e.id=el.dataset.id;e.name=c.name||'';e.note=c.note||'';e.vid=clientVid(c);
    const ps=patternsOf(c);if(ps.length)e.patterns=ps;ui.editClient=e;ui.arm=null;render();window.scrollTo(0,0)},
  ccancel(){ui.editClient=null;render()},
  padd(el){const e=ui.editClient;e.patterns.push(newPat(el.dataset.m,e.vid));render()},
  pdup(el){const e=ui.editClient,p=clone(e.patterns[+el.dataset.i]);p.id=uid('p');if(p.mode==='week')p.days=[];else p.dates=[];e.patterns.splice(+el.dataset.i+1,0,p);render();toast('パターンを複製しました。曜日または日付を選んでください')},
  pdel(el){ui.editClient.patterns.splice(+el.dataset.i,1);render()},
  pmode(el){const p=ui.editClient.patterns[+el.dataset.i];p.mode=el.dataset.m;render()},
  pday(el){const p=ui.editClient.patterns[+el.dataset.i],d=el.dataset.d;p.days=p.days.includes(d)?p.days.filter(x=>x!==d):[...p.days,d];render()},
  pdateadd(el){const i=+el.dataset.i,p=ui.editClient.patterns[i],v=document.getElementById('pd_'+i).value;
    if(!v){toast('日付を選んでください');return}if(!p.dates.includes(v))p.dates=[...p.dates,v].sort();render()},
  pdatedel(el){const p=ui.editClient.patterns[+el.dataset.i];p.dates=p.dates.filter(x=>x!==el.dataset.v);render()},
  csave(){const e=ui.editClient;if(!e.name.trim()){toast('利用者名を入力してください');return}
    for(let i=0;i<e.patterns.length;i++){const p=e.patterns[i],n='パターン'+(i+1);

      if(p.mode==='date'&&!p.dates.length){toast(n+'の日付を追加してください');return}
      if(!p.pick.on&&!p.drop.on){toast(n+'のお迎え・お送りのどちらかを「利用」にしてください');return}}
    const id=e.id||uid('c');materializeVehicles();
    put('clients',id,{name:e.name.trim(),note:e.note.trim(),vid:e.vid,patterns:e.patterns.map(p=>normPat(p,e))});ui.editClient=null;render();toast(e.name.trim()+' さんを保存しました')},
  cdel(){const id=ui.editClient.id;if(ui.arm!=='c'+id){ui.arm='c'+id;render();return}del('clients',id);ui.editClient=null;ui.arm=null;render();toast('削除しました（作成済みの送迎表には残ります）')},
  hadd(){const n=document.getElementById('newHelper').value.trim();if(!n){toast('名前を入力してください');return}put('staff',uid('h'),{name:n,role:'helper',active:true});render();toast(n+' さんを添乗員に追加しました')},
  sdel(el){const id=el.dataset.id;if(ui.arm!=='s'+id){ui.arm='s'+id;render();return}del('staff',id);ui.arm=null;render()},
  vadd(){materializeVehicles();const vs=vehicles();put('vehicles',uid('v'),{name:'車両'+(vs.length+1),order:Math.max(...vs.map(v=>v.order||0))+1,driver:'',helper:''});render()},
  vdel(el){const id=el.dataset.id;if(ui.arm!=='v'+id){ui.arm='v'+id;render();return}materializeVehicles();del('vehicles',id);ui.arm=null;render()},
  backup(){const data={app:'sogei',version:2,exportedAt:new Date().toISOString()};COLLS.forEach(c=>data[c]=S[c]);saveFile(`送迎管理_バックアップ_${todayStr()}.json`,JSON.stringify(data,null,1))},
  async 'restore-go'(){const d=ui.restore.data;ui.restore=null;render();
    for(const c of COLLS)for(const [id,v] of Object.entries(d[c]||{}))await put(c,id,v);
    ui.day=null;render();toast('復元しました')},
  'restore-cancel'(){ui.restore=null;render()},
};
const INP={ // 入力中（再描画しない）
  leg(el){const L=findR(el.dataset.k)[el.dataset.t];L[el.dataset.f]=el.value;markDirty();if(el.dataset.f==='driver')scheduleRender()},
  c(el){ui.editClient[el.dataset.f]=el.value},
  oth(el){const o=ui.other,g=el.dataset.g,f=el.dataset.f;if(!g){o[f]=el.value;return}
    const L=o[g];if(el.type==='checkbox'){L.on=el.checked;render();return}L[f]=el.value;
    if(f==='vid'){L.driver=baseDriver(L.vid);L.helper=baseHelper(L.vid);render()}},
  pat(el){const i=+el.dataset.i,p=ui.editClient.patterns[i],g=el.dataset.g,f=el.dataset.f;
    if(!g){p[f]=el.value;return}
    const L=p[g];if(el.type==='checkbox'){L.on=el.checked;render();return}
    L[f]=el.value;if(f==='driver')return;if(el.value&&!L.on){L.on=true;const cb=document.getElementById(`p_${i}_${g}_on`);if(cb)cb.checked=true}},
};
const CHG={ // 確定時
  date(el){if(el.value){ui.date=el.value;ui.day=null;render()}},
  month(el){if(el.value){ui.month=el.value;render()}},
  legveh(el){const L=findR(el.dataset.k)[el.dataset.t];L.vid=el.value;L.driver=baseDriver(L.vid);L.helper=baseHelper(L.vid);ui.dayDirty=true;render()},
  otherfrom(el){const o=ui.other;if(!el.value){o.cid=null;render();return}
    const c={id:el.value,...S.clients[el.value]},legs=defaultLegs(c,ui.date);o.cid=c.id;o.name=c.name;
    TYPES.forEach(([k])=>{const L=legFor(c,ui.date,k);o[k]={on:legs.includes(k),vid:L.vid,driver:L.driver||baseDriver(L.vid),helper:baseHelper(L.vid),dep:L.dep,arr:L.arr}});
    o.note=c.note||'';render()},
  dname(el){const id='d'+el.dataset.slot,n=el.value.trim(),cur=S.staff[id];
    if(!n){if(cur){del('staff',id);toast('運転手'+el.dataset.slot+'を空欄にしました')}render();return}
    put('staff',id,{name:n,role:'driver',slot:+el.dataset.slot,active:cur?cur.active!==false:true});render();toast('運転手'+el.dataset.slot+'：'+n+' を保存しました')},
  dactive(el){put('staff',el.dataset.id,{...S.staff[el.dataset.id],active:el.value==='1'});render()},
  hname(el){const s=S.staff[el.dataset.id];if(el.value.trim())put('staff',el.dataset.id,{...s,name:el.value.trim()})},
  hactive(el){put('staff',el.dataset.id,{...S.staff[el.dataset.id],role:'helper',active:el.value==='1'});render()},
  vname(el){if(el.value.trim()){materializeVehicles();saveVehicle(el.dataset.id,{name:el.value.trim()})}},
  vstaff(el){materializeVehicles();saveVehicle(el.dataset.id,{[el.dataset.f]:el.value})},
  restore(el){const f=el.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.app!=='sogei')throw 0;ui.restore={name:f.name,data:d};render()}catch(e){toast('このファイルは送迎管理のバックアップではありません')}};rd.readAsText(f)},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='addName')ui.addName=el.value;if(el.dataset&&INP[el.dataset.in])INP[el.dataset.in](el)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&CHG[el.dataset.ch])CHG[el.dataset.ch](el)});
const VIEWS=['home','day','sheet','clients','vehicles','drivers'];
function route(){let h=location.hash.slice(1);if(h==='staff')h='vehicles';ui.view=VIEWS.includes(h)?h:'home';ui.arm=null;if(mode!=='loading')render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
route();initStore();
</script>

</body>
</html>
